# cargo-deny configuration (M9): supply-chain gates run in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Any RUSTSEC advisory (vulnerability, unmaintained, unsound, yanked) fails CI
# by default in cargo-deny >= 0.15. Add ignores here only with a comment
# explaining why they don't apply.
#
# Everything below is transitive — none of it is a direct dependency. Revisit
# on every Tauri upgrade; most of these clear when Tauri moves to GTK4 and to
# quick-xml 0.39.
ignore = [
    # --- Real vulnerabilities, upstream-blocked -------------------------
    # quick-xml DoS: quadratic attribute-duplicate checking (0194) and
    # unbounded namespace-declaration allocation in NsReader (0195). Fixed
    # in quick-xml 0.39, which we cannot reach: Tauri pins `^0.38.0` and
    # 0.38.4 is the last of that line. Both require attacker-controlled XML
    # to exploit; OpenDictate parses no XML at runtime — the dependency is
    # Tauri's, used at bundle time. Drop these the moment Tauri allows 0.39.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- Unmaintained, Linux-only ---------------------------------------
    # gtk-rs GTK3 bindings, archived upstream. Pulled in by Tauri's Linux
    # backend only; we ship Windows, where these are never compiled. They
    # appear because deny.toml deliberately keeps a linux target in [graph]
    # to keep the portable crates honest.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",

    # --- Unmaintained, build-time only ----------------------------------
    # proc-macro-error: a proc-macro dependency, never in the shipped binary.
    "RUSTSEC-2024-0370",

    # unic-* crates are unmaintained but sound; they provide Unicode tables
    # and have no known vulnerability. No replacement is available without
    # changing the crates that depend on them.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
# Everything in the tree today is permissive. MPL-2.0 is file-level copyleft
# (fine for unmodified dependency use); no GPL family in the allow list on
# purpose — a GPL transitive dep should be a loud, deliberate decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    # whisper-rs and whisper-rs-sys are Unlicense-only. Every other Unlicense
    # crate in the tree is dual-licensed (Unlicense OR MIT), so MIT already
    # covered them. Unlicense is a public-domain dedication — strictly more
    # permissive than MIT, and it carries no attribution requirement.
    "Unlicense",
]

[bans]
# Duplicate versions are a size/compile-time smell, not an error (whisper/ort
# pull long tails); highlight the worst offenders without failing the build.
multiple-versions = "warn"
wildcards = "deny"
# The only wildcards in the tree are this workspace's own crates depending on
# each other by path — `od-core-types = { path = "..." }` carries no version,
# which cargo-deny reads as `*`. Third-party wildcards are still denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
