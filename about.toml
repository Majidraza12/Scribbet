# cargo-about: generates THIRD-PARTY-NOTICES.txt, which ships inside the
# installer. MIT, BSD and Apache all require passing along the copyright
# notice of code you redistribute; this is how that obligation is met for a
# binary, where nobody can read Cargo.toml.
#
# Regenerate with:
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt
#
# Keep `accepted` in sync with the allow list in deny.toml — cargo-deny gates
# what may enter the tree, this decides what gets attributed.

# Only what actually ships. The Linux-only GTK tail behind Tauri is not in the
# Windows binary and would pad the file with irrelevant licences.
targets = ["x86_64-pc-windows-msvc"]

# Build-time and test-only crates are not redistributed, so they carry no
# attribution obligation.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The od-* crates are ours, covered by the top-level LICENSE.
private = { ignore = true }

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Unlicense",
]
