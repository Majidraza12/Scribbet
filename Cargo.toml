[workspace]
resolver = "3"
members = [
    "crates/core-types",
    "crates/audio",
    "crates/vad",
    "crates/stt",
    "crates/cleanup",
    "crates/rewrite",
    "crates/commands",
    "crates/insertion",
    "crates/pipeline",
    "crates/storage",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = ""
# Raised from 1.85 to take time 0.3.47, which patches RUSTSEC-2026-0009
# (DoS via stack exhaustion). rust-toolchain.toml pins `stable`, so every
# build already used a newer compiler than this line claimed.
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
od-core-types = { path = "crates/core-types" }
od-audio = { path = "crates/audio" }
od-vad = { path = "crates/vad" }
od-stt = { path = "crates/stt" }
od-cleanup = { path = "crates/cleanup" }
od-rewrite = { path = "crates/rewrite" }
od-commands = { path = "crates/commands" }
od-insertion = { path = "crates/insertion" }
od-pipeline = { path = "crates/pipeline" }
od-storage = { path = "crates/storage" }

# Shared external dependencies (versions pinned once, used by member crates)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
regex = "1"
toml = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Faster iteration; overridden per-crate later if debugging needs full info.
debug = "line-tables-only"
