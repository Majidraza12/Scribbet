[package]
name = "opendictate-desktop"
# Internal to this workspace; never published to crates.io.
publish = false
description = "OpenDictate desktop shell: Tauri app hosting the dictation pipeline (tray, overlay, hotkeys)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
od-core-types.workspace = true
od-audio.workspace = true
od-stt.workspace = true
od-pipeline.workspace = true
od-storage.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# Second launch = focus the running instance's settings window instead of a
# hotkey-already-registered panic (found in M9 soak setup).
tauri-plugin-single-instance = "2"
od-insertion.workspace = true
serde.workspace = true
serde_json = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Model onboarding download (M8): the app's single deliberate network path
# (pinned URL + pinned SHA-256, user-initiated; docs/06).
ureq = "2"
sha2 = "0.10"

[features]
# GPU-accelerated STT (whisper.cpp Vulkan backend). Off by default: building
# it needs the Vulkan SDK, which CI does not have. Runtime falls back to CPU
# on machines without a Vulkan device, so a gpu build is safe to run anywhere.
gpu-vulkan = ["od-stt/vulkan"]

[[bin]]
name = "opendictate-desktop"
path = "src/main.rs"

[dev-dependencies]
# M9 end-to-end suite: synthetic audio -> pipeline -> real EDIT window.
od-cleanup.workspace = true
hound = "3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }
