[package]
name = "opendictate-desktop"
description = "OpenDictate desktop shell: Tauri app hosting the dictation pipeline (tray, overlay, hotkeys)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
od-core-types.workspace = true
od-audio.workspace = true
od-stt.workspace = true
od-pipeline.workspace = true
od-storage.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
od-insertion.workspace = true
serde.workspace = true
serde_json = { workspace = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "opendictate-desktop"
path = "src/main.rs"
