[package]
name = "od-stt"
description = "SttEngine trait and backends: whisper.cpp (default), Moonshine ONNX (optional streaming)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
od-core-types.workspace = true
# whisper.cpp bindings (ADR-5). Builds the C++ library via cmake/MSVC.
whisper-rs = "0.16"
thiserror.workspace = true
tracing.workspace = true

[features]
# GPU-accelerated whisper via Vulkan (any modern GPU; runtime falls back to
# CPU when no device is present, so a vulkan build stays universal).
# Build-time requirement: Vulkan SDK (glslc) — not part of default CI builds.
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
# WAV loading for fixture-driven transcription tests.
hound = "3"
